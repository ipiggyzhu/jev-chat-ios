name: Jev
options:
  bundleIdPrefix: com.jev
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Jev:
    type: application
    platform: iOS
    sources:
      - Sources/Jev
    dependencies:
      - target: JevKeyboard
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.jev.ios
    info:
      path: Sources/Jev/Info.plist
      properties:
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "导入聊天截图做本地识别，截图不会上传。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jev.ios
  JevKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Sources/JevKeyboard
      - Sources/Jev/Shared.swift
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.jev.ios
    info:
      path: Sources/JevKeyboard/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: zh-Hans
            PrefersRightToLeft: false
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jev.ios.keyboard
